title = "common-go secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Local development state and generated scanner reports"
paths = ['''(^|/)(\.cache|\.research_files|\.testing|\.agent_notes|\.telemetry)(/|$)''', '''(^|/)sec\.sarif$''']

[[allowlists]]
description = "Third-party SQLite Windows cryptography identifiers"
paths = [
  '''(^|/)vendor/modernc\.org/sqlite/lib/sqlite_windows_(386|amd64|arm64)\.go$''',
]

[[allowlists]]
description = "SQLite generated Windows SDK type names and blob-format constants"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)vendor/modernc\.org/sqlite/lib/sqlite_g_0000000000060000\.go$''']
regexTarget = "line"
regexes = ['''(?m)^(const BCRYPT_AES_WRAP_KEY_BLOB = "Rfc3565KeyWrapBlob"|const NCRYPT_PKCS8_PRIVATE_KEY_BLOB = "PKCS8_PRIVATEKEY"|type (BCRYPT_DSA_KEY_BLOB_V2|DHPRIVKEY_VER3|PBCRYPT_DSA_KEY_BLOB_V2|T_BCRYPT_DSA_KEY_BLOB_V2|T_PRIVKEYVER3|_BCRYPT_DSA_KEY_BLOB_V2) = [A-Za-z0-9_]+)$''']
